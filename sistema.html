<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoFix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>AutoFix</h1>
    <span>Usuário: Administrador</span>
    <button onclick="sair()">Sair</button>
</header>

<nav>
    <button onclick="mostrar('dashboard')">Dashboard</button>
    <button onclick="mostrar('clientes')">Clientes</button>
    <button onclick="mostrar('veiculos')">Veículos</button>
    <button onclick="mostrar('ordens')">Ordens de Serviço</button>
</nav>

<main>

    <section id="dashboard">

        <h2>Dashboard</h2>

        <div class="cards">

            <div>
                Clientes
                <br>
                <b id="totalClientes">0</b>
            </div>

            <div>
                Veículos
                <br>
                <b id="totalVeiculos">0</b>
            </div>

            <div>
                Ordens
                <br>
                <b id="totalOS">0</b>
            </div>

        </div>

    </section>


    <section id="clientes" class="oculto">

        <h2>Clientes</h2>

        <input id="nome" placeholder="Nome">
        <input id="cpf" placeholder="CPF">
        <input id="telefone" placeholder="Telefone">
        <input id="email" placeholder="E-mail">

        <button onclick="adicionarCliente()">
            Cadastrar
        </button>

        <input
            id="busca"
            placeholder="Buscar por nome ou CPF"
            oninput="carregarClientes()"
        >

        <ul id="listaClientes"></ul>

    </section>


    <section id="veiculos" class="oculto">

        <h2>Veículos</h2>

        <input id="placa" placeholder="Placa">
        <input id="marca" placeholder="Marca">
        <input id="modelo" placeholder="Modelo">
        <input id="ano" placeholder="Ano">

        <select id="clienteVeiculo">
            <option value="">Selecione o cliente</option>
        </select>

        <button onclick="adicionarVeiculo()">
            Cadastrar
        </button>

        <ul id="listaVeiculos"></ul>

    </section>


    <section id="ordens" class="oculto">

        <h2>Ordens de Serviço</h2>

        <select id="clienteOS" onchange="carregarVeiculosOS()">
            <option value="">Selecione o cliente</option>
        </select>

        <select id="veiculoOS">
            <option value="">Selecione o veículo</option>
        </select>

        <input id="servico" placeholder="Serviço">
        <input id="valor" type="number" placeholder="Valor">
        <input id="dataOS" type="date">

        <select id="status">
            <option>Aberta</option>
            <option>Em andamento</option>
            <option>Concluída</option>
        </select>

        <button onclick="adicionarOS()">
            Cadastrar
        </button>

        <ul id="listaOS"></ul>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
